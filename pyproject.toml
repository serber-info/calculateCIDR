[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cidr-calculator"
dynamic = ["version"]
description = "CLI CIDR network calculator — IPv4 & IPv6, subnet division, address type, binary and JSON output"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergio Berruetta" }]
requires-python = ">=3.9"
dependencies = ["shellcolorize>=1.1.0"]
keywords = ["cidr", "subnet", "ipv4", "ipv6", "network", "calculator", "sysadmin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage     = "https://github.com/serber-info/calculateCIDR"
"Bug Tracker" = "https://github.com/serber-info/calculateCIDR/issues"
"Source Code" = "https://github.com/serber-info/calculateCIDR"
Changelog    = "https://github.com/serber-info/calculateCIDR/blob/main/CHANGELOG.md"

[project.scripts]
cidr = "cidr_calculator:run"

[tool.setuptools]
py-modules = ["cidr_calculator"]

[tool.setuptools.dynamic]
version = { attr = "cidr_calculator.VERSION" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F", "B"]
