[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cidr-calculator"
version = "2.0.0"
description = "CLI CIDR network calculator — IPv4 & IPv6, wildcard mask, subnet division, binary display"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sergio Berruetta" }]
requires-python = ">=3.8"
dependencies = ["shellcolorize", "tabulate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage     = "https://github.com/serber-info/calculateCIDR"
"Bug Tracker" = "https://github.com/serber-info/calculateCIDR/issues"
"Source Code" = "https://github.com/serber-info/calculateCIDR"

[project.scripts]
cidr = "cidr_calculator:main"

[tool.setuptools]
py-modules = ["cidr_calculator"]
